<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1400px; height: 560px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(120deg, #18314A 0%, #0B0826 55%, #071123 100%);
    display: flex; align-items: center; justify-content: center; gap: 110px;
    color: #F5F9FF;
  }
  .brand { display: flex; flex-direction: column; gap: 26px; max-width: 640px; }
  .logo-row { display: flex; align-items: center; gap: 26px; }
  .logo-row img { width: 120px; height: 120px; border-radius: 27px;
    box-shadow: 0 14px 44px rgba(0,0,0,.55); }
  h1 { font-size: 88px; letter-spacing: -2px; }
  .tagline { font-size: 34px; line-height: 1.35; color: #A7C7D7; }
  .tagline b { color: #F5F9FF; }
  .sub { font-size: 22px; color: #7F97AB; }
  .bars { display: flex; gap: 16px; align-items: center; height: 340px; }
  .bars span { width: 34px; border-radius: 17px; }
  .bars span:nth-child(1) { height: 150px; background: #FF4DA6; }
  .bars span:nth-child(2) { height: 250px; background: #2BBBAD; }
  .bars span:nth-child(3) { height: 330px; background: #FFEC00; }
  .bars span:nth-child(4) { height: 210px; background: #8A6CFF; }
  .bars span:nth-child(5) { height: 165px; background: #3FA5FF; }
  .bars span:nth-child(6) { height: 240px; background: #7CFF00; }
  .bars span:nth-child(7) { height: 130px; background: #FF8A00; }
</style>
</head>
<body>
  <div class="brand">
    <div class="logo-row">
      <img src="../icons/icon128.png" alt="">
      <h1>Noizy</h1>
    </div>
    <div class="tagline"><b>Static for your history,</b><br>confetti for your tabs.</div>
    <div class="sub">Bury your browsing trail in harmless noise &middot; retheme any page in one click</div>
  </div>
  <div class="bars"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
</body>
</html>
